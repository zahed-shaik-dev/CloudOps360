name: CloudOps360 - Docker CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cloudops360-frontend
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cloudops360-backend

jobs:

  # ============================================================
  # 1. VALIDATE APPLICATION
  # ============================================================

  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate backend
        working-directory: backend
        run: node --check src/server.js


  # ============================================================
  # 2. BUILD & PUSH DOCKER IMAGES
  # ============================================================

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: validate

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}


  # ============================================================
  # 3. DEPLOY TO EC2
  # ============================================================

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker

    steps:

      - name: Deploy CloudOps360 to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "======================================"
            echo "Starting CloudOps360 deployment"
            echo "======================================"

            cd ~/cloudops360

            echo "Pulling latest Docker images..."
            docker compose pull

            echo "Starting updated containers..."
            docker compose up -d

            echo "Removing unused Docker images..."
            docker image prune -f

            echo "Current container status:"
            docker compose ps

            echo "======================================"
            echo "Deployment completed"
            echo "======================================"


  # ============================================================
  # 4. VERIFY PRODUCTION
  # ============================================================

  verify:
    name: Verify Production
    runs-on: ubuntu-latest
    needs: deploy

    steps:

      - name: Verify production API
        run: |
          echo "Checking CloudOps360 production API..."

          response=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.EC2_HOST }}/api/health)

          echo "HTTP status: $response"

          if [ "$response" != "200" ]; then
            echo "Production health check failed."
            exit 1
          fi

          echo "Production API is healthy."

