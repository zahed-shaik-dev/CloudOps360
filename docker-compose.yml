
services:

  # ==========================================================
  # POSTGRESQL
  # ==========================================================

  postgres:
    image: postgres:16-alpine
    container_name: cloudops360-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ==========================================================
  # BACKEND API
  # ==========================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: cloudops360-backend:1.0
    container_name: cloudops-api
    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}

      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}

    ports:
      - "148:5000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5000/api/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ==========================================================
  # FRONTEND
  # ==========================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: cloudops360-frontend:1.0
    container_name: cloudops360-cont
    restart: unless-stopped

    ports:
      - "145:80"

    depends_on:
      backend:
        condition: service_healthy


  # ==========================================================
  # PROMETHEUS
  # ==========================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: cloudops360-prometheus
    restart: unless-stopped

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    depends_on:
      backend:
        condition: service_healthy


  # ==========================================================
  # NODE EXPORTER
  # ==========================================================

  node-exporter:
    image: prom/node-exporter:latest
    container_name: cloudops360-node-exporter
    restart: unless-stopped

    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

    ports:
      - "9100:9100"


  # ==========================================================
  # CADVISOR
  # ==========================================================

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cloudops360-cadvisor
    restart: unless-stopped

    ports:
      - "8081:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro


  # ==========================================================
  # GRAFANA
  # ==========================================================

  grafana:
    image: grafana/grafana:latest
    container_name: cloudops360-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus


# ============================================================
# PERSISTENT VOLUMES
# ============================================================

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

